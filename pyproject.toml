[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dealcalc"
version = "0.5.1"
description = "Расчёты стоимости недвижимости и автомобилей для оценки в РФ, импорт аналогов и MCP для ИИ."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "id0mas7er", email = "id0mas7er@gmail.com" }]
keywords = ["real-estate", "valuation", "appraisal", "russia", "calculator", "mcp", "finance"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy-financial>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.0.0,<2"]

[project.urls]
Homepage = "https://github.com/id0mas7er/dealcalc-rf"
Repository = "https://github.com/id0mas7er/dealcalc-rf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dealcalc.rf" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
