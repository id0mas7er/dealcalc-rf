[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dealcalc"
version = "0.1.0"
description = "Pure-Python real estate investment calculation engine with a local MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DealCalc Pro", email = "Rdaise76@gmail.com" }]
keywords = ["real-estate", "investment", "calculator", "mcp", "finance"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy-financial>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://dealcalcpro.com"
Repository = "https://github.com/dealcalcpro2026/dealcalc-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
